<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="css_chtgpt.css">
</head>
<body>

    <div class="container">
        <h1 class="head">Expense Tracker</h1>
            
        <section class="iner-container">
            
            <form id="expense-form">
                <label for="expense" id="name-label" >Expense Name</label>
                <input type="text" id="expense-name" placeholder="Expense Name" required>
                <label for="amount" id="amount-label">Amount</label>
                <input type="number" id="expense-amount" placeholder="Amount" required>
                <label for="date" id="date-label" >Date</label>
                <input type="date" id="expense-date" required>
                
                <button type="submit">Add Expense</button>
                <div>
                <h3>Expenses<ul id="expense-list" class="expense-display"></ul></h3>
                </div>
                <div class="filter-group">
                    <label for="filter-date">Filter by Date:</label>
                    <input type="date" id="filter-date">
                    <h2>Total: ₦<span id="total-expense">0</span></h2>
                </div>
            </form>
            <h6 class="foot"> (c)2024 The Programmer's University</h6>
            
            
        </section>
        

        
    </div>

    <script src="app.js"></script>
</body>
</html>
